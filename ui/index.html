<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calibration Trending System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body class="desktop-app-body">

<div class="app-layout">
  <!-- 1. LEFT APP DOCK / SIDEBAR -->
  <aside class="app-sidebar">
    <div class="sidebar-brand">
      <span class="brand-glyph"></span>
      <div class="brand-text">
        <div class="brand-name">CAL-TREND</div>
        <div class="brand-tag">STDS METROLOGY</div>
      </div>
    </div>

    <!-- Navigation Menu Items -->
    <nav class="sidebar-nav">
      <button class="nav-item active" id="navDashboard" onclick="router.navigate('dashboard')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span>Fleet Telemetry</span>
      </button>

      <button class="nav-item" id="navHTBasic" onclick="router.navigate('htbasic')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
        <span>Cal. Factor Files</span>
      </button>

      <button class="nav-item" onclick="app.importCert()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        <span>Import Cert PDF</span>
      </button>

      <button class="nav-item" onclick="app.generateBatchReport()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
        <span>Generate Audit PDF</span>
      </button>
    </nav>

    <!-- Sidebar Footer: Network Sync & System Health -->
    <div class="sidebar-footer">
      <div class="sync-telemetry-card" onclick="app.syncNow()" title="Click to trigger immediate network sync">
        <div class="sync-row">
          <span class="sync-pulse"></span>
          <span class="sync-title">NETWORK SYNC</span>
        </div>
        <div class="sync-time mono" id="syncStatusText">Synced: Midnight</div>
      </div>
    </div>
  </aside>

  <!-- 2. MAIN APP WORKSPACE -->
  <div class="app-workspace">
    <!-- Top Command Strip -->
    <header class="app-command-strip">
      <div class="strip-left">
        <span class="strip-section-title" id="currentViewTitle">Fleet Overview</span>
      </div>
      <div class="strip-right">
        <div class="strip-telemetry-tag">STANDARDS LAB · LOCAL APPDATA ENGINE</div>
      </div>
    </header>

    <!-- Viewport Root (Fixed Height, Internal Scroll Only) -->
    <div class="app-viewport-content" id="appRoot"></div>
  </div>
</div>

<!-- Inline Reviewer Note Modal -->
<div class="note-modal-overlay" id="noteModal" onclick="closeNoteModal(event)">
  <div class="note-modal-card" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h4 class="modal-title" id="noteModalTitle">Reviewer Note</h4>
      <button type="button" class="modal-close-btn" onclick="closeNoteModal()">&times;</button>
    </div>
    <p id="noteModalContent" class="modal-body-text"></p>
    <div id="noteModalAttachment" style="display:none; padding-top:12px; border-top:1px dashed var(--line);">
      <a id="noteModalAttachLink" href="#" target="_blank" class="btn btn-primary">Open Attached Quality Report</a>
    </div>
  </div>
</div>

<!-- Edit Calibration Modal -->
<div class="note-modal-overlay" id="editCalModal" onclick="closeEditModal(event)">
  <div class="note-modal-card" style="width: 580px;" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h4 class="modal-title" id="editModalTitle">Edit Calibration Record</h4>
      <button type="button" class="modal-close-btn" onclick="closeEditModal()">&times;</button>
    </div>

    <form id="editCalForm" onsubmit="saveCalibrationModal(event)">
      <input type="hidden" id="editCalId" name="id">
      
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:12px;">
        <div>
          <label class="form-label">Cal Date</label>
          <input type="date" id="editCalDate" name="cal_date" required class="form-input">
        </div>
        <div>
          <label class="form-label">Primary Reading</label>
          <input type="number" step="any" id="editCalMeas" name="measured_value" required class="form-input font-mono">
        </div>
      </div>

      <div id="editTestPointsContainer" style="display:none; margin-bottom:14px; padding:12px; background:var(--panel-subtle); border-radius:6px; border:1px solid var(--line);">
        <div style="font-size:11.5px; font-weight:700; color:var(--primary); margin-bottom:8px;">Characterized Test Points:</div>
        <div id="editTestPointsGrid" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;"></div>
      </div>

      <div id="editDcvContainer" style="display:none; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:12px; padding:10px; background:var(--panel-subtle); border-radius:6px;">
        <div>
          <label class="form-label">Location (Roseville/Loveland)</label>
          <input type="text" id="editCalLoc" name="location" class="form-input">
        </div>
        <div>
          <label class="form-label">Pressure (hPa)</label>
          <input type="number" step="any" id="editCalPress" name="pressure_hpa" class="form-input font-mono">
        </div>
      </div>

      <div style="margin-bottom:12px;">
        <label class="form-label">Reviewer Note / Engineering Justification</label>
        <textarea id="editCalComment" name="reviewer_comment" class="form-textarea" placeholder="Document review notes, acceptance, or investigations..."></textarea>
      </div>

      <div style="margin-bottom:16px; display:flex; flex-direction:column; gap:6px;">
        <label style="display:flex; align-items:center; gap:8px; font-size:12px; cursor:pointer;">
          <input type="checkbox" id="editCalAdj" name="is_adjusted">
          <span>Instrument was Adjusted during this calibration</span>
        </label>
        <label style="display:flex; align-items:center; gap:8px; font-size:12px; cursor:pointer;">
          <input type="checkbox" id="editCalExcl" name="excluded_from_regression">
          <span>Exclude from regression trend fit (Verified outlier)</span>
        </label>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:8px; padding-top:12px; border-top:1px solid var(--line);">
        <button type="button" class="btn" onclick="closeEditModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
