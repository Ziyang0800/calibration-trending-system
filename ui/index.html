<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calibration Trending System</title>
<link rel="stylesheet" href="app.css">
<script src="trend-chart.js"></script>
</head>
<body class="desktop-app-body">

<div class="app-layout">
  <!-- 1. LEFT NAVIGATION DOCK -->
  <aside class="app-sidebar">
    <div class="sidebar-brand">
      <span class="brand-glyph"></span>
      <div class="brand-text">
        <div class="brand-name">CAL-TREND</div>
        <div class="brand-tag">STDS METROLOGY</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Laboratory Workspaces</div>

      <button class="nav-item active" id="navDashboard" onclick="router.navigate('dashboard')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span>Fleet Telemetry</span>
      </button>

      <button class="nav-item" id="navAlerts" onclick="router.navigate('alerts')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        <span>Alerts &amp; Reviews</span>
        <span class="nav-badge-pill" id="sidebarAlertCount" style="display:none;">0</span>
      </button>

      <button class="nav-item" id="navHTBasic" onclick="router.navigate('htbasic')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
        <span>Cal. Factor Files</span>
      </button>

      <div class="nav-section-label" style="margin-top:8px;">Quality &amp; Ingestion</div>

      <button class="nav-item" onclick="app.importCert()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        <span>Import Cert PDF</span>
      </button>

      <button class="nav-item" onclick="app.openReportDialog()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
        <span>Export Audit PDF</span>
      </button>

      <div class="nav-section-label" style="margin-top:8px;">Configuration</div>

      <button class="nav-item" id="navSettings" onclick="router.navigate('settings')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span>Lab Setup &amp; DB</span>
      </button>
    </nav>

    <!-- Sidebar Footer -->
    <div class="sidebar-footer">
      <div class="sync-telemetry-card" onclick="app.syncNow()" title="Click to trigger immediate network backup to Romulus network drive">
        <div class="sync-row">
          <span class="sync-pulse" id="syncStatusPulse"></span>
          <span class="sync-title">NETWORK BACKUP</span>
        </div>
        <div class="sync-time mono" id="syncStatusText">Synced: Checking...</div>
      </div>
    </div>
  </aside>

  <!-- 2. MAIN WORKSPACE VIEWPORT -->
  <div class="app-workspace">
    <header class="app-command-strip">
      <div class="strip-left" style="display:flex; align-items:center; gap:12px;">
        <span class="strip-section-title" id="currentViewTitle">Fleet Overview</span>
        <span id="breadcrumbDetail" style="display:none; color:var(--ink-muted); font-size:12px;"></span>
      </div>
      <div class="strip-right" style="display:flex; align-items:center; gap:14px;">
        <button class="btn" style="padding:3px 8px; font-size:11px;" onclick="app.toggleTheme()">
          <span id="themeToggleLabel">Theme: Dark</span>
        </button>
        <div class="strip-telemetry-tag">STANDARDS METROLOGY ENGINE</div>
      </div>
    </header>

    <div class="app-viewport-content" id="appRoot">
      <!-- Dynamic View Mounted Here by router -->
    </div>
  </div>
</div>

<!-- 3. CALCULATION TRACEABILITY DRAWER -->
<div class="traceability-drawer" id="traceDrawer">
  <div class="drawer-header">
    <h4 class="drawer-title">Calculation Traceability &amp; Math</h4>
    <button type="button" class="btn" style="padding:2px 7px;" onclick="closeTraceDrawer()">&times;</button>
  </div>
  <div class="drawer-body" id="traceDrawerContent">
    <!-- Populated dynamically by asset_detail view -->
  </div>
</div>

<!-- 4. MODALS (Notes, Edit, Ingest Review, PDF Scope Selector) -->
<div class="modal-overlay" id="genericModal" onclick="closeGenericModal(event)">
  <div class="modal-card" id="genericModalCard" onclick="event.stopPropagation()">
    <!-- Populated dynamically -->
  </div>
</div>

<!-- 5. TOAST NOTIFICATION CONTAINER -->
<div class="toast-container" id="toastContainer"></div>

<script src="app.js"></script>
</body>
</html>
